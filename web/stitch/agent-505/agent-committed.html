<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GymLogic — Agent · Applied</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono&amp;display=swap" rel="stylesheet"/>
<script src="theme.js"></script>
</head>
<body class="bg-[#0f0f13] text-foreground font-body-md antialiased min-h-screen flex items-center justify-center">
<div class="w-[390px] h-[884px] bg-background relative overflow-hidden flex flex-col border border-border shadow-2xl rounded-[32px] mx-auto">
<header class="flex justify-between items-center h-16 px-gutter w-full bg-background border-b border-border z-50 shrink-0">
<div class="flex items-center gap-2">
<button class="text-on-surface hover:opacity-80 transition-opacity flex items-center justify-center h-10 w-10">
<span class="material-symbols-outlined" data-icon="chevron_left">chevron_left</span>
</button>
<h1 class="font-headline-sm text-headline-sm font-semibold text-on-surface">Applied</h1>
</div>
<span class="font-label text-[10px] tracking-widest text-primary border border-primary/40 rounded-full px-2 py-0.5">EXPERIMENTAL</span>
</header>
<main class="flex-1 overflow-y-auto px-gutter py-10 flex flex-col items-center gap-6">
<div class="h-16 w-16 rounded-full bg-primary-container/15 border border-primary-container/40 flex items-center justify-center">
<span class="material-symbols-outlined text-primary-fixed-dim text-3xl" data-icon="check">check</span>
</div>
<div class="flex flex-col items-center gap-1 text-center">
<p class="font-headline-sm text-headline-sm text-on-surface">Upper Pump updated</p>
<p class="font-body-sm text-[13px] text-muted">Squat 90 kg → 92.5 kg · from next session</p>
</div>
<div class="w-full flex flex-col">
<p class="font-label text-[10px] text-muted uppercase tracking-widest mb-2">Applied · 1 change</p>
<div class="border border-border rounded-xl bg-surface px-4 py-3 flex items-center justify-between gap-3">
<div class="flex flex-col">
<span class="font-label text-[14px] text-foreground">Squat</span>
<span class="font-body-sm text-[11px] text-muted">Load up</span>
</div>
<div class="flex items-center gap-2 font-mono text-mono">
<span class="text-muted line-through">90 kg</span>
<span class="material-symbols-outlined text-muted text-base" data-icon="arrow_forward">arrow_forward</span>
<span class="text-primary-fixed-dim font-semibold">92.5 kg</span>
</div>
</div>
</div>
<div class="flex items-start gap-2 w-full bg-surface-container-low border border-border rounded-lg px-3 py-2.5">
<span class="material-symbols-outlined text-muted text-base mt-0.5" data-icon="undo">undo</span>
<p class="font-body-sm text-[12px] text-muted">Changed your mind? You can undo this from the programme.</p>
</div>
</main>
<div class="border-t border-border px-gutter py-4 flex gap-2 shrink-0" style="padding-bottom: max(1rem, env(safe-area-inset-bottom))">
<button class="flex-1 h-12 rounded-lg border border-border text-on-surface font-label text-label">Undo</button>
<button class="flex-1 h-12 rounded-lg bg-primary-container text-on-primary font-label text-label font-semibold">Done</button>
</div>
</div>
</body></html>
