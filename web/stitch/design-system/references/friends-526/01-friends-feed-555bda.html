<div class="w-6 h-6"></div> <!-- Spacer for center alignment -->

</div>
</div>

</div>
</div>

<div class="absolute left-5 top-8 bottom-4 w-px bg-outline-variant -z-10"></div>
<!-- Item 1: Alex (Collapsed) -->

</div>

<span>8 exos</span>
</div>

</div>

</div>
