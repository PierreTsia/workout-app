<header class="fixed top-0 w-full z-50 bg-background/80 backdrop-blur-md border-b border-border">

                    </h2>
<p class="font-body-main text-body-main text-muted">
                        No equal feature cards. Just one job and one primary visual per scene.
                    </p>
</div>
<!-- Visual: Focal Crop of UI -->
<div class="flex-1 order-1 md:order-2 w-full max-w-[400px]">
<div class="bg-surface border border-border p-6 rounded-lg relative overflow-hidden group">

<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-primary/10 via-transparent to-transparent pointer-events-none"></div>
<div class="flex justify-between items-end mb-8">
<div>
<span class="font-label-caps text-label-caps text-muted uppercase tracking-wider block mb-1">Current Block</span>
