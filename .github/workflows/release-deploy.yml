name: release-deploy

# Production deploy, gated on a published GitHub Release (ADR 0025). Deploys
# ONLY the artefacts whose files changed since the previous tag: the SPA, the
# web/ docs mini-site, and the changed Supabase Edge Functions. The Cloudflare
# MCP proxy stays manual. A release that changes nothing (e.g. a fix only in
# docs) deploys nothing.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to deploy (defaults to the latest release)
        required: false

concurrency:
  group: release-deploy
  cancel-in-progress: false

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.diff.outputs.tag }}
      spa: ${{ steps.diff.outputs.spa }}
      web: ${{ steps.diff.outputs.web }}
      functions: ${{ steps.diff.outputs.functions }}
      functions_list: ${{ steps.diff.outputs.functions_list }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(git describe --tags --abbrev=0)
          fi
          PREV=$(git tag --sort=-creatordate | grep -vx "$TAG" | head -n1 || true)
          if [ -z "$PREV" ]; then
            CHANGED=$(git ls-files)
          else
            CHANGED=$(git diff --name-only "$PREV" "$TAG")
          fi
          echo "$CHANGED" > /tmp/changed.txt

          has() { grep -qE "$1" /tmp/changed.txt; }

          SPA_RE='^(src/|public/|index\.html$|vite\.config\.ts$|package\.json$|package-lock\.json$|tsconfig.*\.json$|postcss\.config\.js$|eslint\.config\.js$|components\.json$)'
          FUNCS=$(printf '%s\n' "$CHANGED" | awk -F/ '/^supabase\/functions\// {print $3}' | sort -u | grep -v '^_shared$' | tr '\n' ' ' || true)

          {
            echo "tag=$TAG"
            echo "spa=$(has "$SPA_RE" && echo true || echo false)"
            echo "web=$(has '^web/' && echo true || echo false)"
            echo "functions=$([ -n "$FUNCS" ] && echo true || echo false)"
            echo "functions_list=$FUNCS"
          } >> "$GITHUB_OUTPUT"

          echo "Release $TAG (previous: ${PREV:-none})"
          echo "changed files:"; printf '%s\n' "$CHANGED" | sed 's/^/  /'

  deploy-spa:
    needs: [targets]
    if: needs.targets.outputs.spa == 'true'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.targets.outputs.tag }}
      - run: npm i -g vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  deploy-web:
    needs: [targets]
    if: needs.targets.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.targets.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}

  deploy-functions:
    needs: [targets]
    if: needs.targets.outputs.functions == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.targets.outputs.tag }}
      - uses: supabase/setup-cli@v1
        with:
          version: 2.76.9
      - name: Deploy changed Edge Functions
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set — skipping Edge Function deploy. Set it (T263) or deploy manually."
            exit 0
          fi
          for fn in ${{ needs.targets.outputs.functions_list }}; do
            echo "Deploying $fn"
            supabase functions deploy "$fn" --project-ref favusepjqwpcroiolvaz
          done
