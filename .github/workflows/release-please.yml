name: release-please

# Opens/updates the standing `chore(release): vX.Y.Z` PR from Conventional
# Commits. Merging that PR cuts the tag + GitHub Release. `docs`/`chore`/`ci`/
# `test` never cut a release, so a doc-only merge is inert. See ADR 0025.
#
# The deploy is invoked directly (reusable workflow) when a release is created:
# a release made with the default `GITHUB_TOKEN` does NOT trigger an
# `on: release` workflow run, so a deploy listening on the release event could
# never fire. This reusable call is the **only** automatic deploy path;
# `release-deploy.yml` deliberately has no `on: release` trigger (it would
# double-deploy once a PAT is used), and `workflow_dispatch` covers a hand-cut
# release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          # A PAT (fine-grained, Contents + Pull requests: write) makes the
          # release PR run CI: a PR opened with the default GITHUB_TOKEN
          # suppresses its own `pull_request` workflows, so the release PR would
          # stay BLOCKED on the required checks. Falls back to GITHUB_TOKEN when
          # the secret is unset (the release PR then needs an admin merge).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy:
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release-deploy.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
