name: deploy-web

# The docs mini-site (web/) deploys on merge — ADR 0028, which amends ADR 0025 §4
# for this artefact only. The SPA and the Supabase Edge Functions keep the release
# gate, for the reasons ADR 0025 §4 gives: the SPA is a versioned artefact whose
# service-worker precache a byte-identical redeploy busts, and SERVER_INFO.version
# must name the release that shipped it. The mini-site is static content with no
# version and no runtime contract, so none of that applies.
#
# Same secrets, same Vercel project and same CLI path the release used to run for
# this artefact. Previews are unaffected: `preview-deploy-web` in ci.yml still
# deploys one per `web/**` PR with a sticky comment.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
  workflow_dispatch:

# Deliberately its own group, NOT the release-deploy group. Sharing that lock
# would let a content merge cancel a *pending* release deploy — cancel-in-progress
# protects running runs, not queued ones — which would skip the SPA and Edge
# Function deployments and break ADR 0025 §7. The docs site has exactly one
# deployment path (ADR 0028): release-deploy no longer touches web/. Within this
# group, a newer merge replaces a pending deploy, which is what content wants.
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
